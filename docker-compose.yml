# Local/dev convenience. For production, put both services behind HTTPS (see README).
services:
  api:
    build: ./backend
    environment:
      # Origins allowed to call the API from a browser (comma-separated)
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-60}
      DATA_PROVIDER: ${DATA_PROVIDER:-yfinance}
      TWELVEDATA_API_KEY: ${TWELVEDATA_API_KEY:-}  # only needed for DATA_PROVIDER=twelvedata
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}  # unset = /api/_stats disabled
      LOG_TASK_TOKEN: ${LOG_TASK_TOKEN:-}  # unset = prediction-log task disabled
      DATABASE_URL: ${DATABASE_URL:-}  # unset = SQLite inside the container (lost when it is recreated)
      CLIENT_ERROR_LOGGING: ${CLIENT_ERROR_LOGGING:-false}
    ports: ["8000:8000"]
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        # Inlined into the browser bundle at build time: must be reachable FROM THE BROWSER
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_ERROR_REPORTING: ${NEXT_PUBLIC_ERROR_REPORTING:-false}
    ports: ["3000:3000"]
    depends_on: [api]
    restart: unless-stopped
