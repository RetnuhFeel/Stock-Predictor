name: Keep Render services awake

# Free Render services sleep after ~15 min without traffic, and a cold start takes about a minute.
# This workflow pings both of them to reduce cold starts. It is a best-effort courtesy, NOT a guarantee:
#  * GitHub's scheduler is best-effort. A "*/10" cron rarely fires every 10 minutes: runs are routinely delayed by
#    several minutes and sometimes dropped, especially at the top of the hour (so the minutes below are off-peak).
#    Gaps longer than 15 minutes happen, and then Render sleeps the service anyway.
#  * GitHub disables scheduled workflows after 60 days without repository activity (re-enable in the Actions tab).
#  * Render's free tier has 750 instance hours per workspace per month (no rollover). One always-on service uses
#    ~744 h in a 31-day month, so two always-on services (~1,488 h) cannot both stay up all month. When the hours run
#    out Render suspends every free web service in the workspace until the next month. If you need both services
#    up 24/7, use a paid instance for at least one of them, or ping only the API (the web app is static-ish and
#    tolerates a slow first load better than the API does).
# Misses are annotations only; the run never fails.
on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"   # every ~10 min, but off the :00/:30 marks where GitHub is busiest
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Ping API and web
        shell: bash
        run: |
          # A cold start on the free tier can take ~50s+, so allow 90s per attempt and retry 3 times.
          # A miss after all retries is reported as a warning annotation, not a failed run.
          status=0
          for url in \
            "https://stock-predictor-api-2dnn.onrender.com/health" \
            "https://stock-predictor-web-ts7p.onrender.com/"; do
            if curl -fsS --max-time 90 --retry 3 --retry-all-errors --retry-delay 10 \
                 -o /dev/null -w "$url -> HTTP %{http_code} in %{time_total}s\n" "$url"; then
              :
            else
              echo "::warning title=Keep-alive miss::$url did not respond successfully after 3 retries"
              status=1
            fi
          done
          echo "Done (misses are warnings only; exit status ${status} ignored)."
          exit 0
