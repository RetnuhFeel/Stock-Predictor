name: CI
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements.lock
      - run: pip install -c requirements.lock -r requirements-dev.txt
      - run: ruff check .
      - run: ruff check ../analysis
      - run: pytest -q

  analysis:
    # Smoke test only: proves analysis/run_analysis.py still runs against the backend code (offline, made-up prices,
    # 2 tickers). The committed results/charts come from a real-data run; see analysis/README.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            analysis/requirements.txt
            backend/requirements.txt
            backend/requirements.lock
      - run: pip install -c backend/requirements.lock -r analysis/requirements.txt
      - run: python analysis/run_analysis.py --synthetic --quick --out "$RUNNER_TEMP/analysis-smoke"
      - run: test "$(ls "$RUNNER_TEMP"/analysis-smoke/figures/*.png | wc -l)" -eq 5
      - run: python analysis/build_findings.py --check

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web-smoke:
    # Headless Chrome + axe-core against the built app with a mocked API (fully offline, no market data needed).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/e2e/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://api.test
      - run: npm ci
        working-directory: web/e2e
      - name: Serve and run smoke test
        working-directory: web
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          npx next start -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000 >/dev/null && break; sleep 1; done
          cd e2e && node smoke.mjs
      - if: failure()
        run: tail -50 /tmp/next.log || true
